jwt.secret=test-secret-key-for-spring-boot-testing-minimum-64-chars-required-for-hs512
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.cache.type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailHealthIndicatorAutoConfiguration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
