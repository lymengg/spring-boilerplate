jwt.secret=test-secret-key-for-spring-boot-testing-minimum-64-chars-required-for-hs512
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.refresh-token-grace-window=60000
jwt.issuer=expense-management-api
jwt.audience=expense-management-web
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.cache.type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailHealthIndicatorAutoConfiguration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
server.forward-headers-strategy=framework
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=WARN
security.account-lockout.max-attempts=5
security.account-lockout.lockout-duration-minutes=15
security.rate-limiting.window-millis=60000
security.rate-limiting.per-user.forgot-password=10
security.rate-limiting.per-user.reset-password=10
security.rate-limiting.per-user.mfa-verify=10
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000
mfa.issuer=Expense Management
mfa.otp-expiration-seconds=300
mfa.pending-token-expiration=300000
mfa.otp-digits=6
server.port=8080
server.compression.enabled=true
server.forward-headers-strategy=framework
app.mail.enabled=false
