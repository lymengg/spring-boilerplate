# Dev profile — local development defaults. Activate with SPRING_PROFILES_ACTIVE=dev.
# Everything here is a local-development convenience that overrides the
# env-required values in application.properties.

# Datasource — H2 in-memory for local dev
spring.datasource.url=jdbc:h2:mem:securitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JPA — validate schema against Flyway migrations; pretty-print SQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# JWT — throwaway dev secret, do not use in production
jwt.secret=dev-only-secret-do-not-use-in-production-000000000000000000000000
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.refresh-token-grace-window=60000
jwt.issuer=expense-management-api
jwt.audience=expense-management-web

# Account Lockout
security.account-lockout.max-attempts=5
security.account-lockout.lockout-duration-minutes=15

# Rate Limiting
security.rate-limiting.window-millis=60000
security.rate-limiting.per-user.forgot-password=10
security.rate-limiting.per-user.reset-password=10
security.rate-limiting.per-user.mfa-verify=10

# App URLs
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000

# MFA
mfa.issuer=Expense Management
mfa.otp-expiration-seconds=300
mfa.pending-token-expiration=300000
mfa.otp-digits=6

# Logging — verbose for local development
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG

# Server
server.port=8080
server.compression.enabled=true
server.forward-headers-strategy=framework

# Mail — no local mail server: disable and exclude mail autoconfiguration
app.mail.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailHealthIndicatorAutoConfiguration
