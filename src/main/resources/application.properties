# Shared configuration for ALL environments (dev, test, prod).
#
# Convention:
# - Values here apply everywhere; environment-specific values are overridden
#   via environment variables (${VAR}) or in a profile file
#   (application-{profile}.properties, e.g. application-dev.properties).
# - Every configurable value is env-required: ${VAR} with NO default, so a
#   missing variable fails fast at startup instead of silently using a value.
# - Local-development defaults (H2, dev secret, DEBUG logging, ...) live in
#   application-dev.properties; test defaults in application-test.properties.

spring.application.name=demo

# Datasource — required in production (no unsafe defaults).
# For local dev, use the dev profile: SPRING_PROFILES_ACTIVE=dev
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=${REDIS_TIMEOUT}

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# JWT — required in production (no unsafe default).
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}
jwt.refresh-token-grace-window=${JWT_REFRESH_TOKEN_GRACE_WINDOW}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}

# Account Lockout
security.account-lockout.max-attempts=${ACCOUNT_LOCKOUT_MAX_ATTEMPTS}
security.account-lockout.lockout-duration-minutes=${ACCOUNT_LOCKOUT_LOCKOUT_DURATION_MINUTES}

# Rate Limiting
security.rate-limiting.window-millis=${RATE_LIMITING_WINDOW_MILLIS}
security.rate-limiting.per-user.forgot-password=${RATE_LIMITING_PER_USER_FORGOT_PASSWORD}
security.rate-limiting.per-user.reset-password=${RATE_LIMITING_PER_USER_RESET_PASSWORD}
security.rate-limiting.per-user.mfa-verify=${RATE_LIMITING_PER_USER_MFA_VERIFY}

# App URLs
app.base-url=${BASE_URL}
app.frontend-url=${FRONTEND_URL}

# MFA
mfa.issuer=${MFA_ISSUER}
mfa.otp-expiration-seconds=${MFA_OTP_EXPIRATION_SECONDS}
mfa.pending-token-expiration=${MFA_PENDING_TOKEN_EXPIRATION}
mfa.otp-digits=${MFA_OTP_DIGITS}

# Logging — prod-safe defaults; dev profile overrides to DEBUG
logging.level.com.example.demo=${LOG_LEVEL_APP}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY}
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Server
server.port=${SERVER_PORT}
server.compression.enabled=${SERVER_COMPRESSION}
# Trust X-Forwarded-* from the reverse proxy (Caddy) so isSecure()/HSTS work.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY}
server.compression.mime-types=application/json,application/javascript,text/html,text/css
server.compression.min-response-size=1024

# Mail — autoconfiguration is available by default; the dev profile excludes
# it (no local mail server). Enable with APP_MAIL_ENABLED=true + spring.mail.*.
app.mail.enabled=${APP_MAIL_ENABLED}
# Optional: comma-separated autoconfiguration classes to exclude. Mail is off
# by default, so exclude its autoconfig + health indicator unless overridden.
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailHealthIndicatorAutoConfiguration}

# Seed admin — created once at startup when SEED_ADMIN_PASSWORD is set
# (empty = disabled). Optional, so these keep defaults unlike the required vars.
app.seed-admin.username=${SEED_ADMIN_USERNAME:admin}
app.seed-admin.email=${SEED_ADMIN_EMAIL:admin@example.com}
app.seed-admin.password=${SEED_ADMIN_PASSWORD:}

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
