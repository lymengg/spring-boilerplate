spring.application.name=demo

# Datasource
spring.datasource.url=jdbc:h2:mem:securitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
logging.level.org.hibernate.SQL=WARN

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# JWT (use env var JWT_SECRET in production)
# jwt.secret=SET_VIA_ENVIRONMENT_VARIABLE_JWT_SECRET
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.issuer=security-boilerplate
jwt.audience=api.security-boilerplate

# Account Lockout
security.account-lockout.max-attempts=5
security.account-lockout.lockout-duration-minutes=15

# Rate Limiting
security.rate-limiting.max-login-requests=5
security.rate-limiting.window-millis=60000

# MFA
mfa.issuer=security-boilerplate
mfa.otp-expiration-seconds=300
mfa.pending-token-expiration=300000
mfa.otp-digits=6

# Logging
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
