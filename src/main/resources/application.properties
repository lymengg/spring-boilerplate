# Shared configuration for ALL environments (dev, test, prod).
#
# Convention:
# - Values here apply everywhere; environment-specific values are overridden
#   via environment variables (${VAR:default}) or in a profile file
#   (application-{profile}.properties, e.g. application-dev.properties).
# - Production-required values have NO default and fail fast at startup if
#   missing: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_DRIVER, DB_USERNAME,
#   DB_PASSWORD, SPRING_JPA_DIALECT, JWT_SECRET.
# - Local-development conveniences (H2, dev secret, DEBUG logging, ...) live
#   in application-dev.properties.

spring.application.name=demo

# Datasource — required in production (no unsafe defaults).
# For local dev, use the dev profile: SPRING_PROFILES_ACTIVE=dev
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
# Pretty-printed SQL is a dev convenience — off by default outside dev.
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=${REDIS_TIMEOUT}

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# JWT — required in production (no unsafe default).
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.refresh-token-grace-window=60000
jwt.issuer=security-boilerplate
jwt.audience=api.security-boilerplate

# Account Lockout
security.account-lockout.max-attempts=5
security.account-lockout.lockout-duration-minutes=15

# Rate Limiting
security.rate-limiting.window-millis=60000
security.rate-limiting.per-user.forgot-password=${RATE_LIMITING_PER_USER_FORGOT_PASSWORD:10}
security.rate-limiting.per-user.reset-password=${RATE_LIMITING_PER_USER_RESET_PASSWORD:10}
security.rate-limiting.per-user.mfa-verify=${RATE_LIMITING_PER_USER_MFA_VERIFY:10}

# App URLs
app.base-url=${BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# MFA
mfa.issuer=security-boilerplate
mfa.otp-expiration-seconds=300
mfa.pending-token-expiration=300000
mfa.otp-digits=6

# Logging — prod-safe defaults; dev profile overrides to DEBUG
logging.level.com.example.demo=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Server
server.port=${SERVER_PORT:8080}
server.compression.enabled=${SERVER_COMPRESSION:true}
server.compression.mime-types=application/json,application/javascript,text/html,text/css
server.compression.min-response-size=1024
# Behind a reverse proxy: honour X-Forwarded-* for scheme, host and client IP.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY}

# Mail — autoconfiguration is available by default; the dev profile excludes
# it (no local mail server). Enable with APP_MAIL_ENABLED=true + spring.mail.*.
app.mail.enabled=${APP_MAIL_ENABLED:false}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailHealthIndicatorAutoConfiguration

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Seed Admin — overridden via env vars in production; dev profile uses safe defaults.
seed.admin.username=${SEED_ADMIN_USERNAME:admin}
seed.admin.email=${SEED_ADMIN_EMAIL:admin@example.com}
seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
