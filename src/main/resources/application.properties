spring.application.name=demo

# Datasource (H2 default for dev, overridden by env vars in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:securitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
logging.level.org.hibernate.SQL=WARN

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# JWT
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.issuer=security-boilerplate
jwt.audience=api.security-boilerplate

# Account Lockout
security.account-lockout.max-attempts=5
security.account-lockout.lockout-duration-minutes=15

# Rate Limiting
security.rate-limiting.window-millis=60000
security.rate-limiting.per-user.forgot-password=${RATE_LIMITING_PER_USER_FORGOT_PASSWORD:10}
security.rate-limiting.per-user.reset-password=${RATE_LIMITING_PER_USER_RESET_PASSWORD:10}
security.rate-limiting.per-user.mfa-verify=${RATE_LIMITING_PER_USER_MFA_VERIFY:10}

# App URLs
app.base-url=${BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# MFA
mfa.issuer=security-boilerplate
mfa.otp-expiration-seconds=300
mfa.pending-token-expiration=300000
mfa.otp-digits=6

# Logging
logging.level.com.example.demo=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Server (production overrides)
server.port=${SERVER_PORT:8080}
server.compression.enabled=${SERVER_COMPRESSION:true}
server.compression.mime-types=application/json,application/javascript,text/html,text/css
server.compression.min-response-size=1024

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
