services:
  app:
    container_name: app
    image: ${DOCKER_IMAGE:-lymengouk/expense-management-api}:${IMAGE_TAG:-latest}
    # No host port mapping: the app is only reachable through Caddy (TLS + trusted headers).
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}
      JWT_REFRESH_TOKEN_GRACE_WINDOW: ${JWT_REFRESH_TOKEN_GRACE_WINDOW:-60000}
      JWT_ISSUER: ${JWT_ISSUER:-expense-management-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-expense-management-web}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_DRIVER: ${SPRING_DATASOURCE_DRIVER:-org.postgresql.Driver}
      SPRING_JPA_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-none}
      SPRING_JPA_DIALECT: ${SPRING_JPA_DIALECT:-org.hibernate.dialect.PostgreSQLDialect}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
      SPRING_JPA_OPEN_IN_VIEW: ${SPRING_JPA_OPEN_IN_VIEW:-false}
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      # Account Lockout
      ACCOUNT_LOCKOUT_MAX_ATTEMPTS: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_LOCKOUT_DURATION_MINUTES: ${ACCOUNT_LOCKOUT_LOCKOUT_DURATION_MINUTES:-15}
      # Rate Limiting
      RATE_LIMITING_WINDOW_MILLIS: ${RATE_LIMITING_WINDOW_MILLIS:-60000}
      RATE_LIMITING_PER_USER_FORGOT_PASSWORD: ${RATE_LIMITING_PER_USER_FORGOT_PASSWORD:-10}
      RATE_LIMITING_PER_USER_RESET_PASSWORD: ${RATE_LIMITING_PER_USER_RESET_PASSWORD:-10}
      RATE_LIMITING_PER_USER_MFA_VERIFY: ${RATE_LIMITING_PER_USER_MFA_VERIFY:-10}
      # MFA
      MFA_ISSUER: ${MFA_ISSUER:-Expense Management}
      MFA_OTP_EXPIRATION_SECONDS: ${MFA_OTP_EXPIRATION_SECONDS:-300}
      MFA_PENDING_TOKEN_EXPIRATION: ${MFA_PENDING_TOKEN_EXPIRATION:-300000}
      MFA_OTP_DIGITS: ${MFA_OTP_DIGITS:-6}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_SECURITY: ${LOG_LEVEL_SECURITY:-WARN}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_COMPRESSION: ${SERVER_COMPRESSION:-true}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      # Mail — off by default. To enable, set APP_MAIL_ENABLED=true and add
      # SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD env vars.
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      # Seed admin — created at startup when SEED_ADMIN_PASSWORD is set (empty = disabled).
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-expense_management}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  caddy:
    container_name: caddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  backend:
    driver: bridge
